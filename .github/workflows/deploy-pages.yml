# Deploy /site folder to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [feature/agentic-overhaul]
    paths: [site/**, .github/workflows/deploy-pages.yml, .github/workflows/ci.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/feature/agentic-overhaul'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
