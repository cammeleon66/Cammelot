name: Minister backlog checks

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minister-backlog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch and determine validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check "$BASE_SHA...$HEAD_SHA"
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/backlog-changed-files"
          runtime=false
          while IFS= read -r path; do
            if [[ "$path" != docs/*.md && ! "$path" =~ ^[^/]+\.md$ ]]; then
              runtime=true
            fi
          done < "$RUNNER_TEMP/backlog-changed-files"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.runtime == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Install declared dependencies
        if: steps.scope.outputs.runtime == 'true'
        run: npm ci

      - name: Install test browser
        if: steps.scope.outputs.runtime == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run existing project checks
        if: steps.scope.outputs.runtime == 'true'
        run: npm test

      - name: Check autonomous dispatcher safeguards
        if: steps.scope.outputs.runtime == 'true'
        shell: bash
        run: |
          if [[ -f tests/automation_dispatcher.test.mjs ]]; then
            node --test tests/automation_dispatcher.test.mjs
          fi
